<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RAREBIRD dusk-birds RARE BIRD (100) — mythical original, crest trailing light, rising. Tier #FF5D8F -->
  <defs>
    <linearGradient id="rbtrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <g stroke="#9C2E55" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- light trail behind (lower-right to body) -->
    <path d="M470 420 Q380 400 322 356 Q282 324 268 296 L318 300 Q352 356 470 420 Z" fill="url(#rbtrail)" stroke="none"/>
    <!-- trailing crest streamers -->
    <path d="M330 128 Q420 96 462 22" stroke-width="9" fill="none" stroke="#FFD166"/>
    <path d="M318 118 Q396 70 424 6" stroke-width="7" fill="none" stroke="#FFD166" opacity="0.7"/>
    <path d="M340 142 Q442 132 496 84" stroke-width="7" fill="none" stroke="#FFD166" opacity="0.5"/>
    <!-- both wings raised -->
    <path d="M240 220 Q212 88 96 62 Q148 150 180 238 Z" fill="#E14A7C"/>
    <path d="M300 214 Q330 84 446 58 Q392 150 358 234 Z" fill="#E14A7C"/>
    <path d="M244 200 Q222 122 130 84" stroke-width="5" stroke="#C23B69" fill="none"/>
    <path d="M304 196 Q328 120 416 82" stroke-width="5" stroke="#C23B69" fill="none"/>
    <!-- body rising diagonal -->
    <path d="M186 312 Q200 232 282 226 Q364 230 366 310 Q364 380 278 386 Q192 384 186 312 Z" fill="#FF5D8F"/>
    <!-- breast glow -->
    <path d="M214 318 Q228 372 280 378 Q246 396 216 356 Q206 336 214 318 Z" fill="#FFE3EC" stroke="none"/>
    <!-- tail: long flowing plumes -->
    <path d="M354 336 Q452 356 500 316 Q470 372 380 380 Z" fill="#E14A7C"/>
    <path d="M356 358 Q448 392 488 362 Q452 406 372 398 Z" fill="#E14A7C" opacity="0.85"/>
    <!-- head with lit crest -->
    <path d="M160 212 Q128 130 208 104 Q282 86 288 162 Q290 224 216 236 Q176 232 160 212 Z" fill="#FF5D8F"/>
    <path d="M196 108 Q188 66 226 44 Q232 84 258 96 Z" fill="#FFD166"/>
    <!-- beak open in song -->
    <path d="M162 216 L108 232 L166 238 Q160 226 162 216 Z" fill="#5C2437"/>
    <!-- eye wonder -->
    <circle cx="212" cy="166" r="15" fill="#FFF9EC"/>
    <circle cx="217" cy="169" r="7.5" fill="#2A2F3C" stroke="none"/>
    <circle cx="206" cy="160" r="3.5" fill="#FFFFFF" stroke="none"/>
  </g>
  <!-- sparkles -->
  <path d="M120 84 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#FFD166"/>
  <path d="M448 470 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" fill="#FF5D8F" opacity="0.8"/>
  <circle cx="70" cy="180" r="5" fill="#FFE3EC"/>
  <circle cx="470" cy="40" r="6" fill="#FFD166" opacity="0.9"/>
</svg>

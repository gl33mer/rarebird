<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RAREBIRD cosmic-voyage KINGFISHER (60) — banded Jupiter, moon crossing. Tier #6FC3DF -->
  <defs>
    <clipPath id="jup"><circle cx="256" cy="266" r="176"/></clipPath>
  </defs>
  <g stroke="#5E4A22" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="256" cy="266" r="176" fill="#E8CFA8"/>
    <g clip-path="url(#jup)" stroke="none">
      <!-- soft bands -->
      <rect x="60" y="128" width="400" height="34" fill="#D9A868"/>
      <rect x="60" y="196" width="400" height="40" fill="#C98F4E"/>
      <rect x="60" y="272" width="400" height="36" fill="#D9A868"/>
      <rect x="60" y="336" width="400" height="42" fill="#C98F4E"/>
      <rect x="60" y="398" width="400" height="30" fill="#D9A868"/>
      <!-- swirl turbulence -->
      <path d="M120 240 q40 -18 84 0 q40 16 84 -2" stroke="#B57F3E" stroke-width="9" fill="none" opacity="0.7"/>
      <path d="M300 232 q34 -14 66 2" stroke="#B57F3E" stroke-width="8" fill="none" opacity="0.6"/>
      <!-- Great Red Spot -->
      <ellipse cx="322" cy="308" rx="52" ry="34" fill="#C4573A"/>
      <ellipse cx="322" cy="308" rx="30" ry="19" fill="#E0704F"/>
      <ellipse cx="314" cy="304" rx="12" ry="7" fill="#F2A088"/>
    </g>
    <!-- teal limb glow (tier accent) -->
    <circle cx="256" cy="266" r="176" fill="none" stroke="#6FC3DF" stroke-width="10" opacity="0.8"/>
    <!-- small moon crossing -->
    <circle cx="120" cy="180" r="24" fill="#8D99AE"/>
    <circle cx="112" cy="172" r="6" fill="#C7CEDB" stroke="none"/>
  </g>
</svg>
